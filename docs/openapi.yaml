openapi: 3.0.3
info:
  title: TradeQut API
  version: 2.0.0
  description: >-
    Generated by scripts/gen-openapi.ts from src/app/routes.ts. Success bodies are { success, message, data }; every
    non-2xx body is ApiError (README "API"). Unknown routes answer 404 ROUTE_NOT_FOUND. After the free trial (or a
    lapsed Pro) every signed-in write answers 402 TRIAL_EXPIRED, except billing, /subscriptions*, DELETE /auth/account,
    POST /auth/logout-all, PUT /user/notifications and POST /analysis/what-if|query.
servers:
  - url: https://api.tradequt.com
  - url: https://api-dev.tradequt.com
components:
  securitySchemes:
    CognitoToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (Cognito id or access token, verified in-process)
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: Admin JWT from POST /v1/admin/login
  schemas:
    Envelope:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
    ApiError:
      type: object
      required:
        - success
        - message
        - errorCode
        - errorMessage
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
          description: Plain text for a trader, shown as is
        errorCode:
          type: string
          description: Stable UPPER_SNAKE_CASE code
        errorMessage:
          type: string
          description: Always equal to message (older clients)
        error:
          type: object
          description: The one place for machine-readable extras; absent when there are none
          required:
            - code
          properties:
            code:
              type: string
              description: Same as errorCode
            retryAfter:
              type: integer
              description: '429: seconds to wait (also the Retry-After header)'
            fields:
              type: array
              description: '400: one entry per invalid field'
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
            feature:
              type: string
              description: '402: the quota or plan feature'
            plan:
              type: string
              enum:
                - free
                - trial
                - pro
            limit:
              type: integer
            used:
              type: integer
            resetsAt:
              type: string
              format: date-time
            requiredPlan:
              type: string
            allowedAccountIds:
              type: array
              items:
                type: string
        requestId:
          type: string
          description: '5xx: matches the access log line'
    PaymentRequired:
      type: object
      required:
        - success
        - errorCode
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errorCode:
          type: string
          enum:
            - QUOTA_EXCEEDED
            - PLAN_REQUIRED
            - TRIAL_EXPIRED
        error:
          type: object
          properties:
            code:
              type: string
            feature:
              type: string
            plan:
              type: string
              enum:
                - free
                - trial
                - pro
            limit:
              type: integer
            used:
              type: integer
            resetsAt:
              type: string
              format: date-time
            requiredPlan:
              type: string
            allowedAccountIds:
              type: array
              items:
                type: string
