  /v1/accounts:
    get:
      summary: GET /v1/accounts
      tags:
        - accounts
      security:
        - CognitoToken: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Validation error (error.fields lists each problem)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
