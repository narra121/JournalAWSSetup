name: Deploy Backend (Prod, manual)

# Run only after the dev soak passed and docs/runbooks/prod-cutover.md step 0 (prerequisites) is done.
# The script refuses prod unless AlarmEmail is an address and the admin, Stripe and ad-config parameter names are under /tradequt/prod/.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-prod to confirm'
        required: true
      params:
        description: 'Space-separated Key=Value stack parameters, e.g. AlarmEmail=ops@example.com AdminSecretParamName=/tradequt/prod/adminSecret AdminJwtSecretParamName=/tradequt/prod/adminJwtSecret'
        required: true
      dry_run:
        description: 'Create and review the change set only (no execution)'
        type: boolean
        default: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_PROFILE: ""
  TRADEQUT_RESEARCH: ${{ runner.temp }}/tradequt

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy-prod' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install SAM CLI and cfn-lint
        run: |
          pip install "aws-sam-cli>=1.172.1"
          pip install "cfn-lint>=1.60.0"
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Dry run (tests, typecheck, lint, build, change set + stateful-resource guard)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          PARAMS: ${{ github.event.inputs.params }}
        run: |
          args=(); for p in $PARAMS; do args+=(--param "$p"); done
          node scripts/deploy.mjs --stage prod --dry-run "${args[@]}"
      - name: Deploy (backups first, change set guard, smoke)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PARAMS: ${{ github.event.inputs.params }}
        run: |
          args=(); for p in $PARAMS; do args+=(--param "$p"); done
          node scripts/deploy.mjs --stage prod --confirm-prod "${args[@]}"
      - name: Keep the change set and backup record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-deploy-record
          path: ${{ runner.temp }}/tradequt/build/backups/
