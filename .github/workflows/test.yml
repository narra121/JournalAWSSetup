name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    name: Tests, typecheck, template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Template lint (SAM >= 1.172.1, cfn-lint >= 1.60.0 knows the Web Function types)
        run: |
          pip install "aws-sam-cli>=1.172.1"
          pip install "cfn-lint>=1.60.0"
          sam validate --lint
      - name: Build bundles
        run: node scripts/build.mjs
