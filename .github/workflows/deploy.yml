name: Deploy Backend (Dev)

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_PROFILE: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # The runner context is not allowed in workflow-level env.
      - name: Set TRADEQUT_RESEARCH
        run: echo "TRADEQUT_RESEARCH=$RUNNER_TEMP/tradequt" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install SAM CLI and cfn-lint
        run: |
          pip install "aws-sam-cli>=1.172.1"
          pip install "cfn-lint>=1.60.0"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Deploy to dev (tests, typecheck, lint, build, change set with guard, backups, smoke)
        run: node scripts/deploy.mjs --stage dev
      - name: Keep the change set and backup record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy-record
          path: ${{ runner.temp }}/tradequt/build/backups/
