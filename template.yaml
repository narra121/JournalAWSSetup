AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TradeQut backend (Cognito + Lambda Web Function behind CloudFront + Event Function + DynamoDB + S3)

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: Deployment stage (lowercase) used in resource names.
    AllowedPattern: '^[a-z0-9-]+$'
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Environment name (dev or prod) used for SSM parameter paths and configuration.
  ApiVersion:
    Type: String
    Default: v1
    Description: API version prefix (e.g. v1); part of the Trades table name.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1,3,5,7,14,30,60,90,120,150,180,365,400,545,731,1827,3653]
    Description: CloudWatch Logs retention in days (10 is not supported; choose nearest 7 or 14).
  GeminiApiKeyParamName:
    Type: String
    Default: /tradequt/geminiApiKey
    Description: Name of SSM SecureString parameter storing the Gemini API key.
  StripeSecretKeyParamName:
    Type: String
    Description: Name of SSM SecureString parameter storing the Stripe secret key (/tradequt/<stage>/stripeSecretKey). No default, so a stack can never fall back to another stage's key; scripts/deploy.mjs refuses prod unless it is under /tradequt/prod/.
  StripeWebhookSecretParamName:
    Type: String
    Description: Name of SSM SecureString parameter storing the Stripe webhook secret (/tradequt/<stage>/stripeWebhookSecret). No default; same prod rule.
  AdConfigParamName:
    Type: String
    Description: Name of SSM parameter storing the ad placement configuration JSON (/tradequt/<stage>/adConfig). No default; same prod rule.
  AdminSecretParamName:
    Type: String
    Default: /tradequt/adminSecret
    Description: SSM SecureString parameter for admin login password.
  AdminJwtSecretParamName:
    Type: String
    Default: /tradequt/adminJwtSecret
    Description: SSM SecureString parameter for admin JWT signing secret.
  CreateAdminInfra:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to create admin S3 bucket, CloudFront distribution, and DNS record.
  AdminDomainName:
    Type: String
    Default: ""
    Description: Admin panel domain (e.g. admin.tradequt.com). Required when CreateAdminInfra=true.
  CustomDomainName:
    Type: String
    Default: ""
    Description: Custom domain name for the API (e.g. api.tradequt.com). Leave empty to skip.
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:acm:[a-z0-9-]+:\d{12}:certificate/.+$'
    Description: ACM certificate ARN for the custom domain (must be in us-east-1).
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for DNS record creation.
  AllowedOrigins:
    Type: String
    Default: "https://tradequt.com,https://www.tradequt.com,https://admin.tradequt.com"
    Description: Comma-separated list of allowed CORS origins (e.g. https://tradequt.com,https://www.tradequt.com).
  # --- Frontend infrastructure parameters (CloudFront + S3 hosting) ---
  CreateFrontendInfra:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to "true" on first deployment to create S3 bucket, CloudFront distribution,
      and DNS records for the frontend. Leave "false" for existing environments.
      Once created, keep "true" so CloudFormation manages the resources.
  FrontendDomainName:
    Type: String
    Default: ""
    Description: Primary domain for the frontend (e.g. dev.tradequt.com or tradequt.com). Required when CreateFrontendInfra=true.
  FrontendWwwDomain:
    Type: String
    Default: ""
    Description: Optional www alias for the frontend (e.g. www.tradequt.com). Leave empty for dev environments.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth Client ID for Sign-In with Google. Leave empty to skip Google auth setup.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth Client Secret (SSM Secure references not supported for Cognito IdP).
  CodeBucket:
    Type: String
    Description: Versioned artifacts bucket (stack tradequt-artifacts) holding the Web and Event Function zips.
  WebCodeKey:
    Type: String
    Description: S3 key of the Web Function zip (web/<stage>/<sha256>.zip).
  WebCodeVersion:
    Type: String
    Description: S3 object version of the Web Function zip.
  EventsCodeKey:
    Type: String
    Description: S3 key of the Event Function zip.
  EventsCodeVersion:
    Type: String
    Description: S3 object version of the Event Function zip.
  AppDomain:
    Type: String
    Default: tradequt.com
    Description: Domain of the From address (an SES-verified identity is needed to send).
  AppHost:
    Type: String
    Default: tradequt.com
    Description: Host used for links in e-mails (dev.tradequt.com on dev).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional e-mail address subscribed to the alarm topic (confirm the SNS mail once).
  ProdUserPoolId:
    Type: String
    Default: ""
    Description: Dev only. Prod Cognito user pool id accepted by the LegacyExtract function (removed after the prod frontend redeploy).
  ProdUserPoolClientId:
    Type: String
    Default: ""
    Description: Dev only. Prod Cognito app client id accepted by the LegacyExtract function.

Conditions:
  HasGoogleAuth: !Not [!Equals [!Ref GoogleClientId, ""]]
  ShouldCreateFrontendInfra: !Equals [!Ref CreateFrontendInfra, "true"]
  ShouldCreateAdminInfra: !Equals [!Ref CreateAdminInfra, "true"]
  HasFrontendWwwDomain: !Not [!Equals [!Ref FrontendWwwDomain, ""]]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  IsProd: !Equals [!Ref Environment, "prod"]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasLegacyExtract: !And
    - !Not [!Equals [!Ref ProdUserPoolId, ""]]
    - !Not [!Equals [!Ref ProdUserPoolClientId, ""]]
  CreateFrontendDns: !And
    - !Condition ShouldCreateFrontendInfra
    - !Condition HasHostedZone
  CreateFrontendWwwDns: !And
    - !Condition ShouldCreateFrontendInfra
    - !Condition HasHostedZone
    - !Condition HasFrontendWwwDomain
  CreateAdminDns: !And
    - !Condition ShouldCreateAdminInfra
    - !Condition HasHostedZone

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub TradeQutUserPool-${StageName}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      LambdaConfig:
        PreSignUp: !GetAtt EventFunction.Arn
        PostConfirmation: !GetAtt EventFunction.Arn
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: !If
        - HasGoogleAuth
        - - COGNITO
          - !Ref GoogleIdentityProvider
        - - COGNITO
      AllowedOAuthFlowsUserPoolClient: !If [HasGoogleAuth, true, false]
      AllowedOAuthFlows: !If
        - HasGoogleAuth
        - - code
        - !Ref AWS::NoValue
      AllowedOAuthScopes: !If
        - HasGoogleAuth
        - - openid
          - email
          - profile
        - !Ref AWS::NoValue
      CallbackURLs: !If
        - HasGoogleAuth
        - !If
          - IsProd
          - - https://tradequt.com/auth/callback
            - https://www.tradequt.com/auth/callback
            - https://tradequt.com/
            - https://www.tradequt.com/
          - - https://dev.tradequt.com/auth/callback
            - https://dev.tradequt.com/
            - http://localhost:8080/auth/callback
            - http://localhost:8080/
            - http://localhost:8081/auth/callback
            - http://localhost:8081/
            - http://localhost:8090/auth/callback
            - http://localhost:8090/
            - http://localhost:8091/auth/callback
            - http://localhost:8091/
            - http://localhost:8095/auth/callback
            - http://localhost:8095/
            - http://localhost:5173/auth/callback
            - http://localhost:5173/
            - http://localhost:5180/auth/callback
            - http://localhost:5180/
            - http://localhost:5181/auth/callback
            - http://localhost:5181/
            - http://localhost:5182/auth/callback
            - http://localhost:5182/
            - http://localhost:5183/auth/callback
            - http://localhost:5183/
            - http://localhost:5184/auth/callback
            - http://localhost:5184/
            - http://localhost:5185/auth/callback
            - http://localhost:5185/
            - http://localhost:5187/auth/callback
            - http://localhost:5187/
            - http://localhost:5190/auth/callback
            - http://localhost:5190/
            - http://localhost:5191/auth/callback
            - http://localhost:5191/
            - http://localhost:5192/auth/callback
            - http://localhost:5192/
            - http://localhost:4173/auth/callback
            - http://localhost:4173/
            - http://localhost:4174/auth/callback
            - http://localhost:4174/
            - http://localhost:4199/auth/callback
            - http://localhost:4199/
