      LogoutURLs: !If
        - HasGoogleAuth
        - !If
          - IsProd
          - - https://tradequt.com/login
            - https://tradequt.com/login?view=logged-out
            - https://tradequt.com/
            - https://www.tradequt.com/login
            - https://www.tradequt.com/login?view=logged-out
            - https://www.tradequt.com/
          - - https://dev.tradequt.com/login
            - https://dev.tradequt.com/login?view=logged-out
            - https://dev.tradequt.com/
            - http://localhost:8080/login
            - http://localhost:8080/login?view=logged-out
            - http://localhost:8080/
            - http://localhost:8081/login
            - http://localhost:8081/login?view=logged-out
            - http://localhost:8081/
            - http://localhost:8090/login
            - http://localhost:8090/login?view=logged-out
            - http://localhost:8090/
            - http://localhost:8091/login
            - http://localhost:8091/login?view=logged-out
            - http://localhost:8091/
            - http://localhost:8095/login
            - http://localhost:8095/login?view=logged-out
            - http://localhost:8095/
            - http://localhost:5173/login
            - http://localhost:5173/login?view=logged-out
