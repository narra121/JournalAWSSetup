  # Google Identity Provider (only created when GoogleClientId is provided)
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleAuth
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        name: name
        username: sub

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasGoogleAuth
    Properties:
      Domain: !Sub "auth-${StageName}.tradequt.com"
      UserPoolId: !Ref UserPool
      CustomDomainConfig:
        CertificateArn: !Ref CertificateArn

  AuthDomainDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasGoogleAuth
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "auth-${StageName}.tradequt.com"
      Type: A
      AliasTarget:
        DNSName: !GetAtt UserPoolDomain.CloudFrontDistribution
        HostedZoneId: Z2FDTNDATAQYW2

  ErrorReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ErrorReportsLifecycle
            Status: Enabled
            Prefix: errors/
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER
            ExpirationInDays: 365
      Tags:
        - Key: Project
          Value: TradeQut

  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Restrict CORS to only allow authenticated API calls, not direct browser access
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [",", !Ref AllowedOrigins]
            AllowedHeaders:
              - "Authorization"
              - "Content-Type"
            AllowedMethods: [GET, PUT]
            MaxAge: 300
      # Block all public access - images can only be accessed through Lambda
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldImages
            Status: Enabled
            Prefix: images/
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
            ExpirationInDays: 1825

  # Explicit bucket policy to enforce secure transport only
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: 
              - !Sub "arn:aws:s3:::${ImagesBucket}/*"
              - !Sub "arn:aws:s3:::${ImagesBucket}"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  TradesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Include ApiVersion so table replacement can occur when adding new GSIs; avoids multi-GSI update limit
      TableName: !Sub Trades-${StageName}-${ApiVersion}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: tradeId
          AttributeType: S
        - AttributeName: openDate
          AttributeType: S
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: tradeId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: trades-by-date-gsi
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: openDate
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: user-idempotency-gsi
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: idempotencyKey
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  DailyStatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub DailyStats-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: stats-by-date-gsi
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuthRateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub AuthRateLimit-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub Accounts-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: accountId
          KeyType: RANGE

  GoalsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub Goals-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: goalId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: goalId
          KeyType: RANGE

  RulesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub Rules-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: ruleId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: ruleId
          KeyType: RANGE

  UserPreferencesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub UserPreferences-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  SavedOptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub SavedOptions-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub Subscriptions-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  AiDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub AiData-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  UsageTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub Usage-${StageName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  StatsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stats-dlq-${StageName}
      MessageRetentionPeriod: 1209600 # 14 days


  # ========================================================================
  # Web Function (all HTTP routes) behind CloudFront + OAC
  # ========================================================================

  ApiWebFunction:
    Type: AWS::Lambda::WebFunction
    Properties:
      FunctionName: !Sub "${StageName}-api"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/web/${StageName}-api"
      RetentionInDays: !Ref LogRetentionDays

  ApiLocalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/web/${StageName}-api.local"
      RetentionInDays: !Ref LogRetentionDays

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt ApiLogGroup.Arn
                  - !GetAtt ApiLocalLogGroup.Arn
              - Sid: Tables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt TradesTable.Arn
                  - !Sub "${TradesTable.Arn}/index/*"
                  - !GetAtt DailyStatsTable.Arn
                  - !Sub "${DailyStatsTable.Arn}/index/*"
                  - !GetAtt AuthRateLimitTable.Arn
                  - !GetAtt AccountsTable.Arn
                  - !GetAtt GoalsTable.Arn
                  - !GetAtt RulesTable.Arn
                  - !GetAtt UserPreferencesTable.Arn
                  - !GetAtt SavedOptionsTable.Arn
                  - !GetAtt SubscriptionsTable.Arn
                  - !GetAtt AiDataTable.Arn
                  - !GetAtt UsageTable.Arn
              - Sid: Buckets
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${ImagesBucket.Arn}/*"
                  - !Sub "${ErrorReportsBucket.Arn}/*"
              - Sid: BucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !GetAtt ImagesBucket.Arn
                  - !GetAtt ErrorReportsBucket.Arn
              - Sid: ReadParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeWebhookSecretParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminSecretParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminJwtSecretParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdConfigParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tradequt/${Environment}/stripe/*"
              - Sid: SendMail
                Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
              - Sid: WriteAdConfig
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdConfigParamName}"
              - Sid: DecryptParameters
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
              - Sid: Cognito
                Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminLinkProviderForUser
                  - cognito-idp:AdminUserGlobalSignOut
                Resource: !GetAtt UserPool.Arn

  ApiRevision:
    Type: AWS::Lambda::WebFunctionRevision
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    DependsOn:
      - ApiLogGroup
      - ApiLocalLogGroup
    Properties:
      FunctionName: !Ref ApiWebFunction
      Description: !Ref WebCodeKey
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref CodeBucket
            Key: !Ref WebCodeKey
            VersionId: !Ref WebCodeVersion
        RuntimeConfig:
          Runtime: nodejs24.x
      ServiceConfig:
        ExecutionRoleArn: !GetAtt ApiFunctionRole.Arn
        # Just under ApiDistribution's OriginReadTimeout (60): CloudFront answers 504 at 60 s, so work that runs longer is billed and lost.
        # Paid AI flows keep their own deadline below this: GEMINI_REQUEST_TIMEOUT_MS, DEFAULT_DEADLINE_MS in src/features/ai/gemini.ts.
        TimeoutSeconds: 58
        MaxConcurrencyPerEnvironment: 64
        EnvironmentVariables:
          TRADES_TABLE: !Ref TradesTable
          DAILY_STATS_TABLE: !Ref DailyStatsTable
          RATE_LIMIT_TABLE: !Ref AuthRateLimitTable
          ACCOUNTS_TABLE: !Ref AccountsTable
          GOALS_TABLE: !Ref GoalsTable
          RULES_TABLE: !Ref RulesTable
          USER_PREFERENCES_TABLE: !Ref UserPreferencesTable
          SAVED_OPTIONS_TABLE: !Ref SavedOptionsTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          AI_DATA_TABLE: !Ref AiDataTable
          USAGE_TABLE: !Ref UsageTable
          IMAGES_BUCKET: !Ref ImagesBucket
          ERROR_REPORTS_BUCKET: !Ref ErrorReportsBucket
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          STAGE_NAME: !Ref Environment
          LOG_LEVEL: info
          GEMINI_API_KEY_PARAM: !Ref GeminiApiKeyParamName
          GEMINI_REQUEST_TIMEOUT_MS: "50000"
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          STRIPE_WEBHOOK_SECRET_PARAM: !Ref StripeWebhookSecretParamName
          ADMIN_SECRET_PARAM: !Ref AdminSecretParamName
          ADMIN_JWT_SECRET_PARAM: !Ref AdminJwtSecretParamName
          AD_CONFIG_PARAM: !Ref AdConfigParamName
          FROM_EMAIL: !Sub "TradeQut <noreply@${AppDomain}>"
          APP_URL: !Sub "https://${AppHost}"
        TelemetryConfig:
          LoggingConfig:
            ApplicationLogLevel: INFO
            SystemLogLevel: WARN

  ApiEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Properties:
      FunctionName: !Ref ApiWebFunction
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !GetAtt ApiRevision.RevisionId
          Weight: 100
      ThrottleConfig:
        RateLimit: !If [IsProd, 300, 100]
      ScalingConfig:
        # Lower caps throttle one dashboard load (about 11 requests at once) with 429 Platform.EndpointMaxEnvThrottle while
        # environments start. Environments scale to zero, so the cap costs nothing idle; RateLimit bounds abuse.
        MaxEnvironments: 10

  ApiOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${StageName}-api"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${StageName}-api"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Authorization
              - CloudFront-Viewer-Country
          QueryStringsConfig:
            QueryStringBehavior: all
          CookiesConfig:
            CookieBehavior: none

  # CORS on top of the managed SecurityHeadersPolicy. OriginOverride false keeps the app's own CORS headers on its responses
  # and fills them in on responses AWS generates (Web Function throttle 429, CloudFront 4xx/5xx), so a browser sees the
  # HTTP status instead of a network failure.
  ApiResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${StageName}-api"
        Comment: Security headers and CORS for the API distribution
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: [authorization, content-type, idempotency-key, x-amz-date, x-api-key]
          AccessControlAllowMethods:
            Items: [DELETE, GET, OPTIONS, PATCH, POST, PUT]
          AccessControlAllowOrigins:
            Items: !Split [",", !Ref AllowedOrigins]
          AccessControlExposeHeaders:
            Items: [authorization, content-type]
          AccessControlMaxAgeSec: 3600
          OriginOverride: false
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref CustomDomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: web-function
            DomainName: !GetAtt ApiEndpoint.DomainName
            OriginAccessControlId: !GetAtt ApiOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: web-function
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref ApiCachePolicy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref ApiResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: /v1/chat/*
            TargetOriginId: web-function
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref ApiResponseHeadersPolicy

  ApiResourcePolicy:
    Type: AWS::Lambda::ResourcePolicy
    Properties:
      ResourceArn: !GetAtt ApiWebFunction.FunctionArn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontInvoke
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: lambda:InvokeWebFunctionEndpoint
            Resource: !GetAtt ApiEndpoint.EndpointArn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ApiDistribution}"

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApiDnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ApiDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ========================================================================
  # Event Function (Cognito triggers, Trades stream, schedules)
  # ========================================================================

  EventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-events"
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref EventsCodeKey
        Version: !Ref EventsCodeVersion
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 600
      Environment:
        Variables:
          TRADES_TABLE: !Ref TradesTable
          ACCOUNTS_TABLE: !Ref AccountsTable
          DAILY_STATS_TABLE: !Ref DailyStatsTable
          SAVED_OPTIONS_TABLE: !Ref SavedOptionsTable
          RULES_TABLE: !Ref RulesTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          AI_DATA_TABLE: !Ref AiDataTable
          IMAGES_BUCKET: !Ref ImagesBucket
          USER_PREFERENCES_TABLE: !Ref UserPreferencesTable
          USAGE_TABLE: !Ref UsageTable
          USER_POOL_ID_PARAM: !Sub "/tradequt/${Environment}/userPoolId"
          GEMINI_API_KEY_PARAM: !Ref GeminiApiKeyParamName
          GEMINI_REQUEST_TIMEOUT_MS: "55000"
          STAGE_NAME: !Ref Environment
          FROM_EMAIL: !Sub "TradeQut <noreply@${AppDomain}>"
          APP_URL: !Sub "https://${AppHost}"
          LOG_LEVEL: info
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tradequt/${Environment}/userPoolId"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParamName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "${ImagesBucket.Arn}/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImagesBucket.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt TradesTable.Arn
                - !Sub "${TradesTable.Arn}/index/*"
                - !GetAtt AccountsTable.Arn
                - !GetAtt DailyStatsTable.Arn
                - !Sub "${DailyStatsTable.Arn}/index/*"
                - !GetAtt SavedOptionsTable.Arn
                - !GetAtt RulesTable.Arn
                - !GetAtt SubscriptionsTable.Arn
                - !GetAtt AiDataTable.Arn
                - !GetAtt UserPreferencesTable.Arn
                - !GetAtt UsageTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt StatsDLQ.Arn
      Events:
        TradesStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TradesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 2
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StatsDLQ.Arn
        PreferencesStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt UserPreferencesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 2
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StatsDLQ.Arn
        RebuildStats:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Description: Periodic stats rebuild
            Input: '{"job":"rebuild-stats"}'
        LifecycleEmails:
          Type: Schedule
          Properties:
            Schedule: cron(0 4 * * ? *)
            Description: Trial ending / trial ended e-mails
            Input: '{"job":"lifecycle-emails"}'
        WeeklyInsights:
          Type: Schedule
          Properties:
            Schedule: cron(30 4 ? * MON *)
            Description: Weekly AI report for Pro and trial users
            Input: '{"job":"weekly-insights"}'

  EventFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StageName}-events"
      RetentionInDays: !Ref LogRetentionDays

  # Standalone policy: attaching it inline would make UserPool -> EventFunction -> Role -> UserPool a cycle.
  EventFunctionCognitoPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EventFunctionCognitoAccess
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminLinkProviderForUser
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminDeleteUser
            Resource: !GetAtt UserPool.Arn
      Roles:
        - !Ref EventFunctionRole

  UserPoolIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tradequt/${Environment}/userPoolId"
      Type: String
      Value: !Ref UserPool
      Description: User pool id for the Event Function (read at run time).

  CognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ========================================================================
  # Legacy extract Function URL (dev only, until the prod frontend stops calling it)
  # ========================================================================

  LegacyExtractFunction:
    Type: AWS::Serverless::Function
    Condition: HasLegacyExtract
    Properties:
      FunctionName: !Sub "${StageName}-legacy-extract"
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref EventsCodeKey
        Version: !Ref EventsCodeVersion
      Handler: index.legacyExtract
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 90
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins: !Split [",", !Join [",", [!Ref AllowedOrigins, "https://tradequt.com,https://www.tradequt.com"]]]
          AllowHeaders:
            - authorization
            - content-type
          AllowMethods:
            - POST
          MaxAge: 3600
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          PROD_USER_POOL_ID: !Ref ProdUserPoolId
          PROD_USER_POOL_CLIENT_ID: !Ref ProdUserPoolClientId
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          USAGE_TABLE: !Ref UsageTable
          GEMINI_API_KEY_PARAM: !Ref GeminiApiKeyParamName
          GEMINI_REQUEST_TIMEOUT_MS: "55000"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParamName}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ========================================================================
  # Alarms
  # ========================================================================

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${StageName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  EventFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub EventFunctionErrors-${StageName}
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  StatsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub StatsDlqVisible-${StageName}
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StatsDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiCloudFront5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ApiCloudFront5xx-${StageName}
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref ApiDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  StripeWebhookFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '"stripe_webhook_failed"'
      MetricTransformations:
        - MetricNamespace: !Sub TradeQut/${StageName}
          MetricName: StripeWebhookFailed
          MetricValue: "1"
          DefaultValue: 0

  StripeWebhookFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub StripeWebhookFailed-${StageName}
      Namespace: !Sub TradeQut/${StageName}
      MetricName: StripeWebhookFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  GeminiErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '"gemini_error"'
      MetricTransformations:
        - MetricNamespace: !Sub TradeQut/${StageName}
          MetricName: GeminiError
          MetricValue: "1"
          DefaultValue: 0

  GeminiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub GeminiErrors-${StageName}
      Namespace: !Sub TradeQut/${StageName}
      MetricName: GeminiError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Plain-text terms, not a JSON pattern: Lambda wraps each app log line as a string in the event's `message`, so `$.msg` never matches
  # (verified with `aws logs test-metric-filter` on dev events). Messages are logged by src/handlers/admin-login/app.ts.
  AdminLoginFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '?"Admin login failed: wrong password" ?"Admin login blocked: global attempt limit reached"'
      MetricTransformations:
        - MetricNamespace: !Sub TradeQut/${StageName}
          MetricName: AdminLoginFailed
          MetricValue: "1"
          DefaultValue: 0

  AdminLoginFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub AdminLoginFailed-${StageName}
      AlarmDescription: Wrong admin passwords or hits on the global admin-login limit; the real admin mistypes once or twice, so this many is guessing.
      Namespace: !Sub TradeQut/${StageName}
      MetricName: AdminLoginFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ========================================================================
  # Frontend Infrastructure (S3 + CloudFront + DNS)
  # Created only when CreateFrontendInfra = "true" (first-time setup).
  # After creation, keep the parameter as "true" so CloudFormation manages them.
  # ========================================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateFrontendInfra
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "tradequt.com-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: TradeQut
        - Key: Environment
          Value: !Ref Environment

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldCreateFrontendInfra
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "tradequt-${Environment}-oac"
        Description: !Sub "OAC for TradeQut ${Environment} frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateFrontendInfra
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldCreateFrontendInfra
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "TradeQut ${Environment} frontend"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: !If [IsProd, PriceClass_All, PriceClass_100]
        Aliases: !If
          - HasFrontendWwwDomain
          - - !Ref FrontendDomainName
            - !Ref FrontendWwwDomain
          - - !Ref FrontendDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: !Sub "tradequt-${Environment}-s3"
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: !Sub "tradequt-${Environment}-s3"
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /_spa.html
            ResponseCode: "200"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponsePagePath: /_spa.html
            ResponseCode: "200"
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: TradeQut
        - Key: Environment
          Value: !Ref Environment

  FrontendDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (fixed)

  FrontendWwwDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendWwwDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendWwwDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (fixed)

  # ========================================================================
  # Admin Panel Infrastructure (S3 + CloudFront + DNS)
  # Created only when CreateAdminInfra = "true".
  # ========================================================================

  AdminCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldCreateAdminInfra
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "tradequt-admin-${Environment}-oac"
        Description: !Sub "OAC for TradeQut ${Environment} admin panel"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateAdminInfra
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "admin.tradequt.com-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: TradeQut
        - Key: Environment
          Value: !Ref Environment

  AdminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateAdminInfra
    Properties:
      Bucket: !Ref AdminBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AdminBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}"

  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldCreateAdminInfra
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "TradeQut ${Environment} admin panel"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases:
          - !Ref AdminDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: !Sub "tradequt-admin-${Environment}-s3"
            DomainName: !GetAtt AdminBucket.RegionalDomainName
            OriginAccessControlId: !Ref AdminCloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: !Sub "tradequt-admin-${Environment}-s3"
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: "200"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: "200"
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: TradeQut
        - Key: Environment
          Value: !Ref Environment

  AdminDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateAdminDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AdminDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt AdminDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (fixed)

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${CustomDomainName}/${ApiVersion}"
  ApiDistributionId:
    Value: !Ref ApiDistribution
  ApiDistributionDomain:
    Value: !GetAtt ApiDistribution.DomainName
  ApiWebFunctionName:
    Value: !Ref ApiWebFunction
  ApiEndpointDomain:
    Value: !GetAtt ApiEndpoint.DomainName
  ApiRevisionId:
    Value: !GetAtt ApiRevision.RevisionId
  EventFunctionName:
    Value: !Ref EventFunction
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TradesTableName:
    Value: !Ref TradesTable
  ImagesBucketName:
    Value: !Ref ImagesBucket
  FrontendDistributionId:
    Condition: ShouldCreateFrontendInfra
    Value: !Ref FrontendDistribution
  FrontendDistributionDomain:
    Condition: ShouldCreateFrontendInfra
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendBucketName:
    Condition: ShouldCreateFrontendInfra
    Value: !Ref FrontendBucket
  ErrorReportsBucketName:
    Value: !Ref ErrorReportsBucket
  CognitoDomain:
    Condition: HasGoogleAuth
    Value: !Sub "auth-${StageName}.tradequt.com"
  LegacyExtractFunctionUrl:
    Condition: HasLegacyExtract
    Description: Dev-only extract URL still called by the stale prod frontend (IMPL D-1(d)); remove after the prod frontend redeploy.
    Value: !GetAtt LegacyExtractFunctionUrl.FunctionUrl
